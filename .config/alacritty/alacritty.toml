[general]

	live_config_reload = true

[window]

	padding = { x = 8, y = 8 }

[font]

	normal = { family = 'Hack', style = 'Regular' }

	size = 13

[cursor]

	style = { shape = "Block", blinking = "On" }

[colors.primary]
background = "#121212"
foreground = "#e0e0e0"

[colors.normal]
black   = "#1e1e1e"
red     = "#7c7c7c"
green   = "#8e8e8e"
yellow  = "#a0a0a0"
blue    = "#b2b2b2"
magenta = "#c4c4c4"
cyan    = "#d6d6d6"
white   = "#e0e0e0"

[colors.bright]
black   = "#4e4e4e"
red     = "#9e9e9e"
green   = "#b0b0b0"
yellow  = "#c2c2c2"
blue    = "#d4d4d4"
magenta = "#e6e6e6"
cyan    = "#f0f0f0"
white   = "#ffffff"

[colors.cursor]
text   = "#121212"
cursor = "#e0e0e0"

[colors.selection]
text       = "#ffffff"
background = "#383838"
