[colors]
background = #121212
background-alt = #282828
foreground = #e0e0e0
primary = #ffffff
secondary = #a8a8a8
alert = #808080
disabled = #505050

[bar/mybar]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font::size=10;2"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = memory cpu pipewire tray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

wm-restack = bspwm

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 65%

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:30:...%

[module/date]
type = internal/date
interval = 1

date = %Y-%m-%d %H:%M
date-alt = %A, %B %d, %Y %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/pipewire]
type = internal/pulseaudio

; Use the default sink
use-ui-max = true

; Format when audio is playing
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-volume-foreground = #FFFFFF

; Format when audio is muted
format-muted = <label-muted>
label-muted = VOL muted
label-muted-foreground = #666666

; Right-click opens a GUI mixer like pavucontrol if installed
click-right = pavucontrol

scroll-up = #pipewire.inc
scroll-down = #pipewire.dec

[settings]
screenchange-reload = true
pseudo-transparency = true
